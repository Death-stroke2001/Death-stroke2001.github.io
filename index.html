<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Northwind — Mindful Nourishment</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css?v=5">
  <link rel="stylesheet" href="css/base.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=5">
  <link rel="stylesheet" href="css/screens.css?v=5">
  <link rel="stylesheet" href="css/transitions.css?v=5">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>

<div id="app">
  <!-- Splash Screen -->
  <section id="screen-splash" class="screen active" style="background:#3b1e5e;">
    <img src="splash.png" alt="North Wind" style="width:100%;height:100%;object-fit:cover;object-position:center;animation:splashFade 1.5s ease-in-out forwards"/>
  </section>

  <!-- Primary Screens -->
  <section id="screen-home" class="screen"></section>
  <section id="screen-brain" class="screen"></section>
  <section id="screen-nourishment" class="screen"></section>

  <!-- Home Sub-screens -->
  <section id="screen-profile" class="screen"></section>
  <section id="screen-profile-edit" class="screen"></section>
  <section id="screen-settings" class="screen"></section>
  <section id="screen-meal-detail" class="screen"></section>
  <section id="screen-log-meal" class="screen"></section>
  <section id="screen-log-meal-journal" class="screen"></section>
  <section id="screen-meal-result" class="screen"></section>
  <section id="screen-recipes" class="screen"></section>
  <section id="screen-recipe-detail" class="screen"></section>
  <section id="screen-grocery" class="screen"></section>
  <section id="screen-reflection" class="screen"></section>
  <section id="screen-energy-detail" class="screen"></section>

  <!-- Brain Sub-screens -->
  <section id="screen-journal" class="screen"></section>
  <section id="screen-journal-history" class="screen"></section>
  <section id="screen-knowledge-supplements" class="screen"></section>
  <section id="screen-knowledge-brainfood" class="screen"></section>
  <section id="screen-knowledge-podcasts" class="screen"></section>

  <!-- Nourishment Sub-screens -->
  <section id="screen-physique-energy" class="screen"></section>
  <section id="screen-physique-muscle" class="screen"></section>
  <section id="screen-physique-weight" class="screen"></section>
  <section id="screen-physique-strength" class="screen"></section>
  <section id="screen-physique-hydration" class="screen"></section>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="bottom-nav"></nav>
</div>

<!-- Scripts -->
<script src="js/data.js?v=5"></script>
<script src="js/router.js?v=5"></script>
<script src="js/charts.js?v=5"></script>
<script src="js/components.js?v=5"></script>
<script src="js/screens/home.js?v=5"></script>
<script src="js/screens/brain.js?v=5"></script>
<script src="js/screens/nourishment.js?v=5"></script>
<script src="js/screens/profile.js?v=5"></script>
<script src="js/screens/meals.js?v=5"></script>
<script src="js/screens/recipes.js?v=5"></script>
<script src="js/screens/grocery.js?v=5"></script>
<script src="js/screens/reflection.js?v=5"></script>
<script src="js/screens/journal.js?v=5"></script>
<script src="js/screens/knowledge.js?v=5"></script>
<script src="js/screens/physique.js?v=5"></script>
<script src="js/screens/energy-detail.js?v=5"></script>
<script src="js/app.js?v=5"></script>

</body>
</html>
